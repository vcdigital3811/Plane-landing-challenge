<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Plane Landing Challenge</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background-color: #87CEEB;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>✈️ 3D Plane Landing Challenge</h1>

    <div id="game-container"></div>

    <div id="controls">
        <label for="aircraft-select"><strong>Select Aircraft:</strong></label>
        <select id="aircraft-select" onchange="changeAircraft()">
            <!-- Airbus -->
            <option value="A220|#d1d5db|commercial">Airbus A220</option>
            <option value="A320|#9ca3af|commercial" selected>Airbus A320</option>
            <option value="A330|#9ca3af|commercial">Airbus A330</option>
            <option value="A340|#9ca3af|commercial">Airbus A340</option>
            
            <!-- Boeing -->
            <option value="Boeing 707|#e5e7eb|commercial">Boeing 707</option>
            <option value="Boeing 717|#d1d5db|commercial">Boeing 717</option>
            <option value="Boeing 727|#d1d5db|commercial">Boeing 727</option>
            <option value="Boeing 737|#6b7280|commercial">Boeing 737</option>
            <option value="Boeing 747|#f3f4f6|commercial">Boeing 747</option>
            <option value="Boeing 757|#9ca3af|commercial">Boeing 757</option>
            <option value="Boeing 767|#9ca3af|commercial">Boeing 767</option>
            <option value="Boeing 777|#e5e7eb|commercial">Boeing 777</option>
            <option value="Boeing 787|#3b82f6|commercial">Boeing 787 Dreamliner</option>

            <!-- Military & Jets -->
            <option value="F-15 Eagle|#4b5563|jet">F-15 Eagle</option>
            <option value="F-16 Falcon|#6b7280|jet">F-16 Fighting Falcon</option>
            <option value="MiG-25 Foxbat|#374151|jet">MiG-25 Foxbat</option>
            <option value="B-2 Spirit|#111827|b2">B-2 Spirit Stealth Bomber</option>
            <option value="SR-71 Blackbird|#030712|sr71">SR-71 Blackbird</option>
        </select>

        <button onclick="landPlane()">Land Aircraft</button>
        <button onclick="resetPlane()" style="background-color: #f44336;">Reset</button>
    </div>

    <div id="status">Select an aircraft and click "Land Aircraft"!</div>

    <script>
        const container = document.getElementById('game-container');
        const statusElement = document.getElementById('status');
        const selectElement = document.getElementById('aircraft-select');

        // 3D Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 300);

        const camera = new THREE.PerspectiveCamera(50, 800 / 500, 0.1, 1000);
        camera.position.set(-30, 15, 45);
        camera.lookAt(20, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(800, 500);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Environment (Ground & Runway)
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        scene.add(ground);

        const runwayGeo = new THREE.PlaneGeometry(250, 12);
        const runwayMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(50, 0.1, 0);
        scene.add(runway);

        // Runway Centerline
        for (let i = -50; i < 150; i += 15) {
            const lineGeo = new THREE.PlaneGeometry(6, 0.8);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(i, 0.2, 0);
            scene.add(line);
        }

        // Global Variables for Animation
        let planeGroup = new THREE.Group();
        scene.add(planeGroup);

        let isLanding = false;
        let animationProgress = 0;
        const startPos = new THREE.Vector3(-60, 25, 0);
        const endPos = new THREE.Vector3(50, 1.2, 0);

        // Build 3D Models based on aircraft type
        function createPlaneModel(type, colorHex) {
            // Clear previous model
            while(planeGroup.children.length > 0) { 
                planeGroup.remove(planeGroup.children[0]); 
            }

            const mainMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            if (type === "b2") {
                // Flying Wing Shape
                const shape = new THREE.Shape();
                shape.moveTo(0, 4);
                shape.lineTo(12, -4);
                shape.lineTo(6, -2);
                shape.lineTo(0, -5);
                shape.lineTo(-6, -2);
                shape.lineTo(-12, -4);
                const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelThickness: 0.2 };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const mesh = new THREE.Mesh(geo, mainMat);
                mesh.rotation.x = Math.PI / 2;
                planeGroup.add(mesh);

            } else if (type === "sr71") {
                // Sleek Needle Body + Delta Wings
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.8, 14, 16), mainMat);
                body.rotation.z = -Math.PI / 2;
                planeGroup.add(body);

                const wing = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 3), mainMat);
                wing.rotation.x = Math.PI / 2;
                wing.position.x = -2;
                planeGroup.add(wing);

            } else if (type === "jet") {
                // Fighter Jet Frame
                const fuselage = new THREE.Mesh(new THREE.ConeGeometry(1, 10, 8), mainMat);
                fuselage.rotation.z = -Math.PI / 2;
                planeGroup.add(fuselage);

                const wings = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 8), mainMat);
                wings.position.x = -1;
                planeGroup.add(wings);

                const tail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 0.2), mainMat);
                tail.position.set(-4, 1, 0);
                planeGroup.add(tail);

            } else {
                // Commercial Airliner (Default Body + Wings + Tail)
                const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 12, 16), mainMat);
                fuselage.rotation.z = Math.PI / 2;
                planeGroup.add(fuselage);

                const nose = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), mainMat);
                nose.position.x = 6;
                planeGroup.add(nose);

                const wings = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 14), mainMat);
                wings.position.x = 0;
                planeGroup.add(wings);

                const tailFin = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 0.3), mainMat);
                tailFin.position.set(-5, 2, 0);
                planeGroup.add(tailFin);

                const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.3), darkMat);
                cockpit.position.set(4.5, 0.8, 0);
                planeGroup.add(cockpit);
            }

            resetPlane();
        }

        function changeAircraft() {
            const [name, color, style] = selectElement.value.split('|');
            createPlaneModel(style, color);
            statusElement.innerText = `Selected: ${name}`;
        }

        function resetPlane() {
            isLanding = false;
            animationProgress = 0;
            planeGroup.position.copy(startPos);
            planeGroup.rotation.set(0, 0, 0);
            
            const [name] = selectElement.value.split('|');
            statusElement.innerText = `Ready to land: ${name}`;
        }

        function landPlane() {
            if (isLanding) return;
            isLanding = true;
            animationProgress = 0;
            const [name] = selectElement.value.split('|');
            statusElement.innerText = `Landing ${name}...`;
        }

        // Render & Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isLanding && animationProgress < 1) {
                animationProgress += 0.005;

                // Smooth interpolation between start and landing point
                planeGroup.position.lerpVectors(startPos, endPos, animationProgress);

                // Pitch angle simulation during descent
                if (animationProgress < 0.85) {
                    planeGroup.rotation.z = -0.1; // Nose down pitch
                } else {
                    planeGroup.rotation.z = 0.05; // Flare back up for touchdown
                }

                if (animationProgress >= 1) {
                    planeGroup.rotation.z = 0;
                    const [name] = selectElement.value.split('|');
                    statusElement.innerText = `✅ ${name} landed successfully!`;
                }
            }

            renderer.render(scene, camera);
        }

        // Initial setup on load
        changeAircraft();
        animate();
    </script>
</body>
</html>
